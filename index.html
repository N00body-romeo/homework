<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework</title>
<style>
  :root { color-scheme: dark; --bg:#040605; --surface:#0c0f0d; --ink:#e6ebe7; --muted:#8e9791; --line:#28302b; --green:#3ddc84; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 16px; }
  h1 { font:600 2rem/1.15 Georgia,serif; margin:0 0 24px; }
  a.card { display:block; padding:16px 18px; margin:0 0 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px; color:var(--ink); text-decoration:none; }
  a.card:hover { border-color:var(--green); }
  a.card b { display:block; color:var(--green); }
  a.card span { color:var(--muted); font-size:14px; }
</style>
<main>
  <h1>Homework</h1>
  <a class="card" href="hmwk1/"><b>HMWK 1</b><span>Private key to public key on a toy elliptic curve</span></a>
  <a class="card" href="hmwk2/"><b>HMWK 2</b><span>From wallet seed to Ethereum address</span></a>
</main>
</html>
